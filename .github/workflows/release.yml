name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

# release-it needs to push the release commit/tag and create the GitHub release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # No self-trigger guard needed: the release commit/tag is pushed with the
    # default GITHUB_TOKEN, and pushes made with that token don't start new
    # workflow runs. (Even if one did, release-it finds no new commits and exits.)
    env:
      HUSKY: '0' # don't install git hooks in CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the version/changelog are computed correctly

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch --set-upstream-to=origin/main main || true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release -- --ci
